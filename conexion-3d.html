<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conexión de Prueba 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: la mesa de prueba en 3D a pantalla completa; barra arriba; panel a la izquierda (abajo en móvil) con los cables de la pieza tocada y una lista para ir marcando.
   Mismo sistema visual oscuro que la simulación y la maqueta (un solo tema, elegido a propósito). */
:root{
  --bg:#0d171d; --panel:rgba(13,24,31,.93); --raise:rgba(180,215,232,.06); --line:rgba(173,205,222,.15);
  --ink:#e3edf2; --muted:#8fa7b4; --water:#4ab6e6; --water-deep:#1d7fb3; --ok:#4fc58e; --warn:#efb23d;
  --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --topbar-h:64px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
code{font-family:var(--f-mono);font-size:12px;background:rgba(0,0,0,.25);padding:1px 5px;border-radius:4px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.tb-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tb-spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink);transition:background .15s}
.btn:hover{background:rgba(180,215,232,.12)}
.btn:focus-visible,.tab:focus-visible,.collapse-btn:focus-visible,.crow:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--water-deep);border-color:transparent;color:#fff}
.btn svg{width:15px;height:15px;flex:none}
#panel{position:fixed;z-index:15;top:calc(var(--topbar-h) + 12px);left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:400px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow:hidden}
body.clean #panel{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:0;padding:11px 4px 10px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--water)}
.collapse-btn{flex:none;width:40px;background:none;border:0;border-left:1px solid var(--line);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.collapse-btn svg{width:18px;height:18px;transition:transform .2s}
.views{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:transparent transparent}
.views:hover{scrollbar-color:rgba(173,205,222,.35) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:6px}
:hover::-webkit-scrollbar-thumb{background:rgba(173,205,222,.35)}
.view{padding:14px 14px 22px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h3{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:18px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
p{margin:0}
.pieces{display:flex;flex-wrap:wrap;gap:6px}
.pieces button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.pieces button[aria-pressed="true"]{background:var(--water-deep);border-color:transparent}
.conn{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;align-items:start;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.crow:hover{border-color:rgba(74,182,230,.5)}
.crow.sel{border-color:var(--water);background:rgba(74,182,230,.08)}
.crow .sw{width:12px;height:12px;border-radius:3px;margin-top:4px}
.crow .main{min-width:0}
.crow .main .pin{display:block;font-family:var(--f-mono);font-weight:500;font-size:13.5px}
.crow .main .to{display:block;font-size:13px}
.crow .main .nt{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.crow .type{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.08);white-space:nowrap}
.arrow{color:var(--water);margin:0 4px}
.tip{padding:9px 11px;border-radius:9px;background:rgba(239,178,61,.12);color:#f6d79a;font-size:12.5px}
.check{display:grid;grid-template-columns:auto 14px 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.check:first-child{border-top:0}
.check input{width:18px;height:18px;accent-color:var(--ok)}
.check .sw{width:12px;height:12px;border-radius:3px}
.check.done span.t{color:var(--muted);text-decoration:line-through}
.group-t{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.prog{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);transition:width .2s}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
body.nolabels #labels .tag:not(.pin){display:none}
.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(12,22,28,.88);border:1px solid rgba(173,205,222,.22);border-radius:8px;padding:4px 8px;white-space:nowrap;font-size:12px;line-height:1.3;will-change:transform}
.tag::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:inherit;border-right:1px solid rgba(173,205,222,.22);border-bottom:1px solid rgba(173,205,222,.22);transform:translateX(-50%) rotate(45deg)}
.tag b{font-weight:600}
.tag.sel{border-color:var(--water);box-shadow:0 0 0 2px rgba(74,182,230,.35)}
.tag.pin{pointer-events:none;font-family:var(--f-mono);font-size:11px;padding:2px 6px;background:rgba(29,127,179,.92);border-color:transparent;color:#fff}
.tag.pin::after{display:none}
#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-family:var(--f-display);font-size:18px;text-align:center;padding:0 24px}
@media (min-width:761px){
  #panel.collapsed{bottom:auto}
  #panel.collapsed .views{display:none}
  #panel.collapsed .tabs{border-bottom:0}
  #panel.collapsed .collapse-btn svg{transform:rotate(180deg)}
}
@media (max-width:760px){
  .brand small,.btn .t{display:none}
  .brand h1{font-size:18px}
  .tb-spacer{display:none}
  #panel{top:auto;left:0;right:0;width:auto;bottom:0;height:52%;border-radius:14px 14px 0 0;border-bottom:0;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease}
  #panel:not(.collapsed) .collapse-btn svg{transform:rotate(180deg)}
  #panel.collapsed{transform:translateY(calc(100% - 46px - env(safe-area-inset-bottom,0px)))}
  .view{padding-left:16px;padding-right:16px}
  .tag{font-size:11px;padding:3px 6px}
}
@media (prefers-reduced-motion: reduce){ #panel{transition:none} .prog i{transition:none} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }
</script>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Mesa de prueba en 3D: protoboard con MB102, ESP32, relé de 4 canales, 1 sensor HC-SR04 y 2 bombas en vasos con agua, con todos sus cables"></canvas>
<div id="labels"></div>

<header id="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="12" width="24" height="9" rx="1.5" fill="#e9ecef"/><path d="M8 12c0-6 6-8 8-3M24 21c0 6-6 7-9 3" fill="none" stroke="#4ab6e6" stroke-width="2.2" stroke-linecap="round"/><path d="M6 14h20M6 19h20" stroke="#e5483d" stroke-width="1"/></svg>
    <div><h1>Conexión de prueba</h1><small>1 sensor · 2 bombas · un solo GND común</small></div>
  </div>
  <div class="tb-group">
    <button class="btn" id="vHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="t">General</span></button>
    <button class="btn" id="vTop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 12h16"/></svg><span class="t">Desde arriba</span></button>
    <button class="btn" id="showAll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="t">Ver todos los cables</span></button>
    <button class="btn" id="lblBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="t">Nombres</span></button>
  </div>
  <div class="tb-spacer"></div>
  <button class="btn" id="hideBtn" aria-pressed="false" title="Ocultar el panel (tecla H)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="t">Ocultar panel</span></button>
</header>

<aside id="panel" aria-label="Cables">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="pieza">Pieza</button>
    <button class="tab" role="tab" aria-selected="false" data-view="lista">Lista para conectar</button>
    <button class="collapse-btn" id="collapseBtn" aria-expanded="true" aria-label="Minimizar panel" title="Minimizar panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
  </div>
  <div class="views">
    <section class="view" id="view-pieza">
      <p class="hint">Toca una pieza en la escena o elígela aquí: se iluminan sus cables y aparece el nombre de cada pin.</p>
      <div class="pieces" id="pieceBtns"></div>
      <div id="pieceInfo"></div>
    </section>
    <section class="view" id="view-lista" hidden>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h3>Conectados</h3><span class="hint" id="progTxt">0 de 0</span></div>
        <div class="prog"><i id="progBar" style="width:0"></i></div>
        <p class="hint" style="margin-top:8px">Conecten en este orden y marquen cada cable. Las marcas se guardan en este navegador.</p>
      </div>
      <div id="checklist"></div>
      <button class="btn" id="resetChecks" style="align-self:flex-start">Desmarcar todo</button>
    </section>
  </div>
</aside>
<div id="loading"><div id="loadingText">Cargando la vista 3D…</div></div>
<script>
  setTimeout(function(){ if(!window.__sceneReady){ var t=document.getElementById('loadingText'); if(t) t.textContent='No se pudo cargar la librería 3D (Three.js). Revisa tu conexión a internet y recarga la página.'; } }, 12000);
</script>
<script type="module">

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- escena (1 unidad = 1 cm, mesa en y = 0) ---------- */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

scene.background = new THREE.Color('#d3d9dc');
const camera = new THREE.PerspectiveCamera(40, 1, 0.3, 800);
const HOME = { pos: V(10, 46, 48), target: V(-3, 0, 1) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(HOME.target); controls.enableDamping = true; controls.minDistance = 6; controls.maxDistance = 160;
controls.maxPolarAngle = Math.PI * 0.49;
scene.add(new THREE.HemisphereLight('#ffffff', '#b8ad9e', 1.25));
const sun = new THREE.DirectionalLight('#fff4e2', 1.9); sun.position.set(20, 60, 30); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 5, far: 150 }); sun.shadow.bias = -0.0005; scene.add(sun);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
const MAT = { pcbBlue: M('#1f5fa8'), pcbBlack: M('#1d2125'), silver: M('#d3d7da', { metalness: 0.7, roughness: 0.3 }), black: M('#1b1c1f'), white: M('#efeee6', { roughness: 0.5 }), foam: M('#f1f1ee', { roughness: 0.95 }) };

{
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 4); t.colorSpace = THREE.SRGBColorSpace;
  const table = mesh(new THREE.PlaneGeometry(120, 90), new THREE.MeshStandardMaterial({ map: t, roughness: 0.8 }), 0, 0, 2, scene, false); table.rotation.x = -Math.PI / 2; table.receiveShadow = true;
}

/* ---------- piezas ---------- */
const PIECES = {}, clickables = [];
function piece(id, name, anchor, desc, obj) {
  PIECES[id] = { id, name, anchor, desc };
  obj.traverse(o => { if (o.isMesh) { o.userData.piece = id; clickables.push(o); } });
}

// Protoboard + MB102. Rieles (texto en la textura): atrás 5 V, adelante 3.3 V.
const BB = { w: 16.5, d: 5.5, y: 0.9 };
const RAIL = { b5: -2.45, bG: -2.2, fG: 1.85, f33: 2.1 };   // z de cada riel
const railPt = (rail, x) => V(x, BB.y + 0.05, RAIL[rail]);
{
  const g = new THREE.Group(); scene.add(g);
  const c = document.createElement('canvas'); c.width = 330; c.height = 110; const x = c.getContext('2d');
  x.fillStyle = '#f5f5f0'; x.fillRect(0, 0, 330, 110); x.fillStyle = '#c8c8c0';
  for (let i = 0; i < 63; i++) for (let j = 0; j < 14; j++) { const yy = j < 2 ? 6 + j * 5 : j < 12 ? 24 + (j - 2) * 6.4 + (j >= 7 ? 4 : 0) : 92 + (j - 12) * 5; x.fillRect(6 + i * 5.1, yy, 2, 2); }
  x.fillStyle = '#d33'; x.fillRect(4, 3, 322, 1.5); x.fillRect(4, 103, 322, 1.5); x.fillStyle = '#36c'; x.fillRect(4, 16, 322, 1.5); x.fillRect(4, 88, 322, 1.5);
  x.font = 'bold 7px sans-serif'; x.fillStyle = '#d33'; x.fillText('+5V', 300, 11); x.fillText('+3.3V', 292, 100); x.fillStyle = '#36c'; x.fillText('GND', 300, 22); x.fillText('GND', 300, 87);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const mats = [M('#eeeeea'), M('#eeeeea'), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 }), M('#eeeeea'), M('#eeeeea'), M('#eeeeea')];
  const bm = new THREE.Mesh(new THREE.BoxGeometry(BB.w, BB.y, BB.d), mats); bm.position.y = BB.y / 2; bm.castShadow = bm.receiveShadow = true; g.add(bm);
  const mb = new THREE.Group(); mb.position.set(-6.55, BB.y, 0); g.add(mb);
  box(3.4, 0.16, 5.3, MAT.pcbBlack, 0, 0.35, 0, mb);
  box(1.4, 0.7, 1.6, MAT.silver, -0.6, 0.75, 1.6, mb);
  box(1.4, 1.1, 1.2, MAT.black, -0.6, 0.95, -2.0, mb);
  box(0.8, 0.6, 0.8, M('#d8d6cf'), 0.7, 0.7, -0.4, mb);
  box(0.35, 0.6, 0.7, M('#e5c330'), 1.1, 0.7, -1.9, mb); box(0.35, 0.6, 0.7, M('#e5c330'), 1.1, 0.7, 1.9, mb);

  piece('proto', 'Protoboard + MB102', V(-2, 4, 0), 'El MB102 va en el extremo izquierdo. Jumper de atrás en <b>5V</b> (rieles de atrás) y el de adelante en <b>3.3</b> (rieles de adelante). Los dos rieles azules son GND y están unidos por el MB102: cualquiera sirve.', g);
}

// Cargador y computadora
{
  const g = new THREE.Group(); g.position.set(-24, 0, -4); scene.add(g); box(4.4, 4.4, 2.4, M('#f3f3f1'), 0, 2.2, 0, g);
  piece('cargador', 'Cargador 5 V 2 A', V(-24, 7, -4), 'Cargador de pared con salida USB-A. Se conecta al MB102 con el cable azul USB-A a USB-A.', g);
  const l = new THREE.Group(); l.position.set(12, 0, 24); l.rotation.y = -0.35; scene.add(l);
  box(16, 0.8, 11, M('#5d646b', { metalness: 0.3 }), 0, 0.4, 0, l); const sc = box(16, 10, 0.5, M('#3a4046', { metalness: 0.3 }), 0, 5.4, 5.3, l); sc.rotation.x = -0.25;
  piece('pc', 'Computadora', V(12, 12, 26), 'Por el USB-C se sube el programa y se ve la consola en Thonny. También alimenta al ESP32.', l);
}

// ESP32 (38 pines). Antena a la izquierda, USB-C a la derecha.
const ESP = { x: -1, y: 1.3, z: 10 };
const ROW_L = ['3V3', 'EN', 'VP (36)', 'VN (39)', '34', '35', '32', '33', '25', '26', '27', '14', '12', 'GND', '13', 'D2', 'D3', 'CMD', '5V'];   // fila que mira a la protoboard
const ROW_R = ['GND', '23', '22', 'TX', 'RX', '21', 'GND', '19', '18', '5', '17', '16', '4', '0', '2', '15', 'D1', 'D0', 'CLK'];
function espPin(name) {
  let i = ROW_L.indexOf(name), side = -1; if (i < 0) { i = ROW_R.indexOf(name); side = 1; }
  return V(ESP.x - 2.29 + i * 0.254, ESP.y + 0.45, ESP.z + side * 1.25);
}
{
  const g = new THREE.Group(); g.position.set(ESP.x, 0, ESP.z); scene.add(g);

canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const h = pick(e); if (!h) return;
  if (h.cable) selectCable(h.cable); else if (h.piece) select(h.piece);
});
let hoverT = 0;
canvas.addEventListener('pointermove', e => { if (e.buttons || performance.now() - hoverT < 80) return; hoverT = performance.now(); canvas.style.cursor = pick(e) ? 'pointer' : ''; });
function pick(e) {
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(clickables, false).filter(h => !h.object.userData.cable || h.object.material.opacity > 0.5);
  return hits[0] ? hits[0].object.userData : null;
}
function updateViewOffset() {
  const w = window.innerWidth, h = window.innerHeight, pn = $('#panel');
  const vis = !document.body.classList.contains('clean') && !pn.classList.contains('collapsed'), top = $('#topbar').offsetHeight;
  let sx = 0, sy = -top / 2;
  if (vis && w > 760) sx = (pn.offsetWidth + 12) / 2;
  if (vis && w <= 760) sy = pn.offsetHeight / 2 - top / 2;
  camera.setViewOffset(w, h, -sx, sy, w, h);
}
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w <= 760 ? 50 : 40; camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--topbar-h', $('#topbar').offsetHeight + 'px'); updateViewOffset();
}
window.addEventListener('resize', resize); resize();
if (mobile()) { camera.position.set(10, 70, 70); openPanel(false); }

clearSel(); renderChecklist();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (fly) { fly.k = Math.min(1, fly.k + dt); const e = 1 - Math.pow(1 - fly.k, 3); camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (fly.k >= 1) fly = null; }
  controls.update(); renderer.render(scene, camera); placeTags();
  requestAnimationFrame(frame);
}
window.__sceneReady = true; $('#loading').hidden = true;
requestAnimationFrame(frame);
</script>
